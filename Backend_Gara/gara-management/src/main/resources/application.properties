spring.application.name=gara-management
server.port=8082

# Cấu hình Database
spring.datasource.url=jdbc:mysql://localhost:3306/QuanLyGaraOto
spring.datasource.username=admin123@
spring.datasource.password=admin123@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA/Hibernate
# Tắt DDL tự động (tạo/sửa bảng) để an toàn hơn trong môi trường Production
# Đối với môi trường Dev, bạn có thể dùng: spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none

# Cấu hình chiến lược đặt tên vật lý của Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Configuration
jwt.secret=YOUR_NEW_ULTRA_SECURE_512_BIT_KEY_MINIMUM_64_CHARACTERS_HERE_AAAAAAAAAAAAAAAAA
jwt.expiration=86400000
# 86400000 ms = 24 hours